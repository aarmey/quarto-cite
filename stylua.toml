# StyLua configuration matching the existing formatting style of this
# codebase: 2-space indentation, double-quoted strings, and Lua 5.4 syntax
# (as used by Pandoc's embedded interpreter).

column_width = 100
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "ConditionalOnly"

[sort_requires]
enabled = false
